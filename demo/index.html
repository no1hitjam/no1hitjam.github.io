  <style>
    .pixelart img {
      display: block;

  </style>
</head>

    <img src="night_test.gif" alt="A character on a street at night beside a brick building">
    <img src="school_test_2.gif" alt="A character standing in an empty classroom">
    <img src="clouds_test.gif" alt="A character standing in the clouds">
