<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<html>
<head>
  <title>Pixel Art - Jackson Lango</title>
  <link href="https://fonts.googleapis.com/css?family=Major+Mono+Display|Roboto|IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../style.css">
  <style>
    .pixelart img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.5em 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div class="pixelart">
    <img src="forest_test.gif" alt="A character walking through a green forest">
    <img src="fairy_test.gif" alt="A character in a dark blue forest at night">
    <img src="night_test.gif" alt="A character on a street at night beside a brick building">
    <img src="school_test_2.gif" alt="A character standing in an empty classroom">
    <img src="5.121.png" alt="A spiked orange flower with a blue eye and flames">
    <img src="52.182.png" alt="A yellow curled creature sitting on a pink flower">
    <img src="87.73.png" alt="A pale ghostly creature with black eyes and a red mouth">
    <img src="91.264.png" alt="A purple spiked creature with white tusks">
    <img src="103.68.png" alt="A brown muscular creature with green hair and round yellow hands">
    <img src="103.380.png" alt="A plant creature with a pineapple crown and floating yellow orbs">
    <img src="113.65a.png" alt="A pink chef surrounded by floating eggs and spoons">
    <img src="144.76.png" alt="A dark blue creature wrapped in a swirl of water">
    <img src="145.76.png" alt="A dark rocky creature surrounded by yellow spikes">
    <img src="146.76.png" alt="A dark rocky creature wrapped in flames">
    <img src="149.110.png" alt="A cluster of orange round creatures with leaves and smoke">
    <img src="212.362.png" alt="A red clawed hand covered in small red creatures">
    <img src="271.13.png" alt="A small brown sprout sitting on a green leaf">
    <img src="372.266.png" alt="An orange curled creature with black tails">
    <img src="381.369.png" alt="A round yellow creature in a blue robe surrounded by gold bars">
  </div>
</body>
</html>
